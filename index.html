<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Sand - Registration Details</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:15px;
  color:#111;
}
.container{
  max-width:500px;
  margin:auto;
  background:white;
  padding:18px;
  border:1px solid #ccc;
  border-radius:8px;
}
h2{text-align:center;color:#075b32;margin-bottom:4px}
.heading{text-align:center;font-weight:bold;margin-top:0}
h3{text-align:center;color:#075b32}
label{
  display:block;
  font-weight:bold;
  margin-top:13px;
}
input,textarea,select{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1px solid #999;
  border-radius:5px;
  font-size:16px;
  background:white;
}
textarea{min-height:70px;resize:vertical}
button{
  width:100%;
  padding:13px;
  margin-top:18px;
  background:#075b32;
  color:white;
  border:0;
  border-radius:5px;
  font-size:16px;
  font-weight:bold;
}
#result{
  display:none;
  margin-top:20px;
  border-top:2px solid #075b32;
  padding-top:10px;
}
.item{
  padding:10px 0;
  border-bottom:1px solid #ddd;
  overflow-wrap:anywhere;
}
.value{display:block;margin-top:5px;font-size:16px}
</style>
</head>

<body>
<div class="container">
  <h2>AP SAND</h2>
  <p class="heading">MANAGEMENT SYSTEM</p>
  <h3>Registration Details</h3>

  <form id="regForm">
    <label>Registration ID</label>
    <input id="regId" required>

    <label>Consumer Name</label>
    <input id="consumerName" required>

    <label>Consumer Mobile No</label>
    <input id="consumerMobile" type="tel" required>

    <label>Construction Name</label>
    <input id="constructionName" required>

    <label>Registration Date &amp; Time</label>
    <input id="regDateTime" type="text"
           placeholder="DD-MM-YYYY HH:MM AM/PM" required>

    <label>Registration Type</label>
    <select id="regType" required>
      <option value="">Select Registration Type</option>
      <option>GENERAL SAND CONSUMPTION</option>
      <option>GOVERNMENT</option>
      <option>OTHER</option>
    </select>

    <label>Registration QTY (in MT)</label>
    <input id="regQty" type="number" step="any" min="0" required>

    <label>Registration Address</label>
    <textarea id="regAddress" required></textarea>

    <button type="submit">Show Registration Details</button>
  </form>

  <div id="result">
    <h3>Entered Registration Details</h3>
    <div class="item"><b>Registration ID</b><span class="value" id="outRegId"></span></div>
    <div class="item"><b>Consumer Name</b><span class="value" id="outConsumerName"></span></div>
    <div class="item"><b>Consumer Mobile No</b><span class="value" id="outConsumerMobile"></span></div>
    <div class="item"><b>Construction Name</b><span class="value" id="outConstructionName"></span></div>
    <div class="item"><b>Registration Date &amp; Time</b><span class="value" id="outRegDateTime"></span></div>
    <div class="item"><b>Registration Type</b><span class="value" id="outRegType"></span></div>
    <div class="item"><b>Registration QTY (in MT)</b><span class="value" id="outRegQty"></span></div>
    <div class="item"><b>Registration Address</b><span class="value" id="outRegAddress"></span></div>
  </div>
</div>

<script>
const ids = [
  "regId",
  "consumerName",
  "consumerMobile",
  "constructionName",
  "regDateTime",
  "regType",
  "regQty",
  "regAddress"
];

document.getElementById("regForm").addEventListener("submit", function(e){
  e.preventDefault();

  const outputIds = [
    "outRegId",
    "outConsumerName",
    "outConsumerMobile",
    "outConstructionName",
    "outRegDateTime",
    "outRegType",
    "outRegQty",
    "outRegAddress"
  ];

  ids.forEach(function(id, index){
    document.getElementById(outputIds[index]).textContent =
      document.getElementById(id).value.trim();
  });

  document.getElementById("result").style.display = "block";
});
</script>
</body>
</html>
