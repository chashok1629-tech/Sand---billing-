
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Details - AP Sand Management System</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:15px;
  background:#f1f3f5;
  color:#222;
  font-family:Arial,sans-serif
}
.card{
  max-width:600px;
  margin:15px auto;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 8px #0001
}
.header{
  background:#176b43;
  color:#fff;
  padding:20px 12px;
  text-align:center
}
.header h2{margin:0;font-size:22px}
.header p{margin:7px 0 0;font-size:14px}
.content{padding:15px}
.item{
  display:grid;
  grid-template-columns:43% 57%;
  gap:8px;
  padding:12px 4px;
  border-bottom:1px solid #ddd;
  align-items:start
}
.label{
  font-weight:bold;
  font-size:14px;
  overflow-wrap:anywhere
}
.value{
  font-size:15px;
  overflow-wrap:anywhere;
  white-space:pre-wrap
}
.status{
  padding:15px;
  text-align:center;
  color:#a11;
  font-weight:bold
}
.footer{
  text-align:center;
  padding:14px;
  color:#555;
  font-size:12px
}
@media(max-width:360px){
  .item{grid-template-columns:40% 60%}
  .label,.value{font-size:13px}
}
</style>
</head>

<body>
<div class="card">
  <div class="header">
    <h2>AP SAND MANAGEMENT SYSTEM</h2>
    <p>Registration Details</p>
  </div>

  <div id="status" class="status">Loading registration details...</div>

  <div class="content" id="details" hidden>
    <div class="item"><div class="label">Registration ID</div><div class="value" id="regId"></div></div>
    <div class="item"><div class="label">Consumer Name</div><div class="value" id="consumerName"></div></div>
    <div class="item"><div class="label">Consumer Mobile</div><div class="value" id="consumerMobile"></div></div>
    <div class="item"><div class="label">Construction Name</div><div class="value" id="constructionName"></div></div>
    <div class="item"><div class="label">Registration Date &amp; Time</div><div class="value" id="regDateTime"></div></div>
    <div class="item"><div class="label">Registration Type</div><div class="value" id="regType"></div></div>
    <div class="item"><div class="label">Registration QTY (in MT)</div><div class="value" id="regQty"></div></div>
    <div class="item"><div class="label">Registration Address</div><div class="value" id="regAddress"></div></div>
  </div>

  <div class="footer">AP Sand Management System</div>
</div>

<script>
(function(){
  const status = document.getElementById("status");
  const details = document.getElementById("details");

  function showError(message){
    status.hidden = false;
    status.textContent = message;
    details.hidden = true;
  }

  function showDetails(data){
    const fields = [
      "regId",
      "consumerName",
      "consumerMobile",
      "constructionName",
      "regDateTime",
      "regType",
      "regQty",
      "regAddress"
    ];

    if(!data || !data.regId || data.regId === "-"){
      showError("Registration details లింక్‌లో లేవు. సరైన QR Code స్కాన్ చేయండి.");
      return;
    }

    fields.forEach(function(key){
      const el = document.getElementById(key);
      const value = data[key];
      el.textContent = (value && value !== "-") ? value : "-";
    });

    status.hidden = true;
    details.hidden = false;
  }

  function readHash(){
    const hash = window.location.hash || "";
    const prefix = "#registration=";

    if(!hash.startsWith(prefix)) return null;

    try{
      const encoded = decodeURIComponent(hash.slice(prefix.length));
      const binary = atob(encoded);
      const bytes = Uint8Array.from(binary, function(ch){
        return ch.charCodeAt(0);
      });
      const json = new TextDecoder("utf-8").decode(bytes);
      return JSON.parse(json);
    }catch(error){
      return null;
    }
  }

  function loadDetails(){
    const data = readHash();

    if(data){
      showDetails(data);
    }else{
      showError("వివరాలు అందలేదు. బిల్‌లోని కొత్త QR Code స్కాన్ చేసి లింక్ తెరవండి.");
    }
  }

  loadDetails();

  // అదే పేజీలో hash మారితే వివరాలను మళ్లీ చదవడం
  window.addEventListener("hashchange", loadDetails);
})();
</script>
</body>
</html>
