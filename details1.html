
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Sand Registration Details</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f1f3f5;
  color: #111;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background: white;
  border: 1px solid #ccc;
  border-radius: 8px;
  overflow: hidden;
}

.header {
  background: #075b32;
  color: white;
  text-align: center;
  padding: 18px 10px;
}

.header h2 {
  margin: 0 0 6px;
  font-size: 21px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.content {
  padding: 16px;
}

h3 {
  margin: 0 0 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #075b32;
}

.detail {
  display: grid;
  grid-template-columns: 42% 5% 53%;
  gap: 0;
  padding: 11px 0;
  border-bottom: 1px solid #ddd;
  overflow-wrap: anywhere;
  line-height: 1.45;
}

.label {
  font-weight: bold;
}

.colon {
  text-align: center;
}

.value {
  text-align: left;
  white-space: pre-wrap;
}

.message {
  padding: 20px;
  text-align: center;
  color: #a00000;
}

.footer {
  text-align: center;
  padding: 12px;
  font-size: 12px;
  color: #555;
}

@media print {
  body {
    padding: 0;
    background: white;
  }

  .container {
    border: none;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="container" id="page">
  <div class="header">
    <h2>AP SAND</h2>
    <p>MANAGEMENT SYSTEM</p>
  </div>

  <div class="content">
    <h3>Registration Details</h3>
    <div id="details"></div>
  </div>

  <div class="footer">
    AP Sand Management System
  </div>
</div>

<script>
const fields = [
  ["Registration ID", "rid"],
  ["Consumer Name", "name"],
  ["Consumer Mobile No", "mobile"],
  ["Construction Name", "construction"],
  ["Registration Date & Time", "date"],
  ["Registration Type", "type"],
  ["Registration QTY (MT)", "qty"],
  ["Registration Address", "address"]
];

const params = new URLSearchParams(window.location.search);
const details = document.getElementById("details");

function addText(parent, tag, className, value) {
  const el = document.createElement(tag);
  el.className = className;
  el.textContent = value;
  parent.appendChild(el);
}

const hasDetails = fields.some(([label, key]) =>
  (params.get(key) || "").trim() !== ""
);

if (!hasDetails) {
  const msg = document.createElement("div");
  msg.className = "message";
  msg.textContent =
    "Registration details are not available. Please scan the correct QR code.";
  details.appendChild(msg);
} else {
  fields.forEach(([label, key]) => {
    const row = document.createElement("div");
    row.className = "detail";

    addText(row, "div", "label", label);
    addText(row, "div", "colon", ":");
    addText(row, "div", "value", params.get(key) || "-");

    details.appendChild(row);
  });
}
</script>

</body>
</html>
