<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Details - AP Sand</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #f4f6fa;
  color: #222;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: 15px auto;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px #00000012;
}

.header {
  padding: 20px 12px;
  text-align: center;
  color: white;
  background: #087b42;
}

.header h2 {
  margin: 0 0 7px;
  font-size: 22px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.content {
  padding: 15px;
}

.row {
  display: grid;
  grid-template-columns: 42% 5% 53%;
  padding: 12px 4px;
  border-bottom: 1px solid #e5e5e5;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.5;
}

.label {
  font-weight: bold;
}

.colon {
  text-align: center;
}

.value {
  overflow-wrap: anywhere;
}

.status {
  padding: 20px 10px;
  text-align: center;
  color: #555;
}

.footer {
  padding: 12px;
  text-align: center;
  background: #f7f7f7;
  color: #555;
  font-size: 12px;
}

@media (max-width: 360px) {
  .row {
    grid-template-columns: 43% 5% 52%;
    font-size: 12px;
  }

  .header h2 {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h2>AP SAND MANAGEMENT SYSTEM</h2>
    <p>Registration Details</p>
  </div>

  <div id="status" class="status">
    Loading registration details...
  </div>

  <div id="details" class="content" style="display:none;">

    <div class="row">
      <div class="label">Registration ID</div>
      <div class="colon">:</div>
      <div class="value" id="regId">-</div>
    </div>

    <div class="row">
      <div class="label">Consumer Name</div>
      <div class="colon">:</div>
      <div class="value" id="consumerName">-</div>
    </div>

    <div class="row">
      <div class="label">Consumer Mobile No</div>
      <div class="colon">:</div>
      <div class="value" id="consumerMobile">-</div>
    </div>

    <div class="row">
      <div class="label">Construction Name</div>
      <div class="colon">:</div>
      <div class="value" id="constructionName">-</div>
    </div>

    <div class="row">
      <div class="label">Registration Date &amp; Time</div>
      <div class="colon">:</div>
      <div class="value" id="regDateTime">-</div>
    </div>

    <div class="row">
      <div class="label">Registration Type</div>
      <div class="colon">:</div>
      <div class="value" id="regType">-</div>
    </div>

    <div class="row">
      <div class="label">Registration QTY (MT)</div>
      <div class="colon">:</div>
      <div class="value" id="regQty">-</div>
    </div>

    <div class="row">
      <div class="label">Registration Address</div>
      <div class="colon">:</div>
      <div class="value" id="regAddress">-</div>
    </div>

  </div>

  <div class="footer">
    AP Sand Management System
  </div>
</div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBAx9O9XU2QChADnpZMFEFqgMYJmWsxxko8",
  authDomain: "ap-sand-billing.firebaseapp.com",
  projectId: "ap-sand-billing",
  storageBucket: "ap-sand-billing.firebasestorage.app",
  messagingSenderId: "908803132126",
  appId: "1:908803132126:web:04e7bdafaa6baf80bb104f",
  measurementId: "G-RXHD8RW3WX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const fields = [
  ["regId", "Registration ID"],
  ["consumerName", "Consumer Name"],
  ["consumerMobile", "Consumer Mobile No"],
  ["constructionName", "Construction Name"],
  ["regDateTime", "Registration Date & Time"],
  ["regType", "Registration Type"],
  ["regQty", "Registration QTY (MT)"],
  ["regAddress", "Registration Address"]
];

function showDetails(data) {
  for (const [id, label] of fields) {
    const value = data[id];
    document.getElementById(id).textContent =
      value !== undefined && value !== null && value !== ""
        ? String(value)
        : "-";
  }

  document.getElementById("status").style.display = "none";
  document.getElementById("details").style.display = "block";
}

function getParam(params, ...names) {
  for (const name of names) {
    const value = params.get(name);
    if (value !== null && value.trim() !== "") {
      return value.trim();
    }
  }
  return "";
}

async function loadDetails() {
  const params = new URLSearchParams(window.location.search);

  const data = {
    regId: getParam(params, "regId", "RegistrationID", "registrationId"),
    consumerName: getParam(params, "consumerName", "ConsumerName"),
    consumerMobile: getParam(params, "consumerMobile", "ConsumerMobile"),
    constructionName: getParam(params, "constructionName", "ConstructionName"),
    regDateTime: getParam(params, "regDateTime", "RegistrationDateTime"),
    regType: getParam(params, "regType", "RegistrationType"),
    regQty: getParam(params, "regQty", "RegistrationQTY"),
    regAddress: getParam(params, "regAddress", "RegistrationAddress")
  };

  // QR URLలో రిజిస్ట్రేషన్ వివరాలు ఉంటే వాటినే చూపిస్తుంది.
  const hasDetails = fields.some(([id]) => data[id] !== "");

  if (hasDetails) {
    showDetails(data);
    return;
  }

  // URLలో Registration ID మాత్రమే ఉంటే Firebaseలో వెతుకుతుంది.
  if (data.regId) {
    try {
      const snapshot = await getDocs(collection(db, "registrations"));
      let found = null;

      snapshot.forEach((doc) => {
        const record = doc.data();

        const recordId =
          record.RegistrationID ??
          record.registrationId ??
          record.regId ??
          "";

        if (
          String(recordId).trim().toLowerCase() ===
          data.regId.trim().toLowerCase()
        ) {
          found = record;
        }
      });

      if (found) {
        showDetails({
          regId: found.RegistrationID ?? found.registrationId ?? found.regId,
          consumerName: found.ConsumerName ?? found.consumerName,
          consumerMobile: found.ConsumerMobile ?? found.consumerMobile,
          constructionName: found.ConstructionName ?? found.constructionName,
          regDateTime: found.RegistrationDateTime ?? found.regDateTime,
          regType: found.RegistrationType ?? found.regType,
          regQty: found.RegistrationQTY ?? found.regQty,
          regAddress: found.RegistrationAddress ?? found.regAddress
        });
      } else {
        document.getElementById("status").textContent =
          "Registration details not found.";
      }
    } catch (error) {
      console.error(error);
      document.getElementById("status").textContent =
        "Unable to load details. Please check your internet connection.";
    }

    return;
  }

  document.getElementById("status").textContent =
    "Registration details are not available in this link.";
}

loadDetails();
</script>

</body>
</html>
