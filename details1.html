
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Details - AP Sand</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#f4f6fa;
  color:#222;
  font-family:Arial,sans-serif;
}

.container{
  max-width:650px;
  margin:15px auto;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 8px #00000012;
}

.header{
  padding:20px 12px;
  text-align:center;
  color:#fff;
  background:#087b42;
}

.header h2{
  margin:0 0 7px;
  font-size:22px;
}

.header p{
  margin:0;
  font-size:14px;
}

.content{padding:15px}

.row{
  display:grid;
  grid-template-columns:42% 5% 53%;
  padding:12px 4px;
  border-bottom:1px solid #e5e5e5;
  overflow-wrap:anywhere;
  font-size:14px;
  line-height:1.5;
}

.label{font-weight:bold}
.colon{text-align:center}
.value{overflow-wrap:anywhere}

.status{
  padding:20px 10px;
  text-align:center;
  color:#555;
  overflow-wrap:anywhere;
}

.footer{
  padding:12px;
  text-align:center;
  background:#f7f7f7;
  color:#555;
  font-size:12px;
}

@media(max-width:360px){
  .row{
    grid-template-columns:43% 5% 52%;
    font-size:12px;
  }
  .header h2{font-size:19px}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>AP SAND MANAGEMENT SYSTEM</h2>
    <p>Registration Details</p>
  </div>

  <div id="status" class="status">
    Loading registration details...
  </div>

  <div id="details" class="content" style="display:none">

    <div class="row">
      <div class="label">Registration ID</div>
      <div class="colon">:</div>
      <div class="value" id="regId">-</div>
    </div>

    <div class="row">
      <div class="label">Consumer Name</div>
      <div class="colon">:</div>
      <div class="value" id="consumerName">-</div>
    </div>

    <div class="row">
      <div class="label">Consumer Mobile No</div>
      <div class="colon">:</div>
      <div class="value" id="consumerMobile">-</div>
    </div>

    <div class="row">
      <div class="label">Construction Name</div>
      <div class="colon">:</div>
      <div class="value" id="constructionName">-</div>
    </div>

    <div class="row">
      <div class="label">Registration Date &amp; Time</div>
      <div class="colon">:</div>
      <div class="value" id="regDateTime">-</div>
    </div>

    <div class="row">
      <div class="label">Registration Type</div>
      <div class="colon">:</div>
      <div class="value" id="regType">-</div>
    </div>

    <div class="row">
      <div class="label">Registration QTY (MT)</div>
      <div class="colon">:</div>
      <div class="value" id="regQty">-</div>
    </div>

    <div class="row">
      <div class="label">Registration Address</div>
      <div class="colon">:</div>
      <div class="value" id="regAddress">-</div>
    </div>

  </div>

  <div class="footer">
    AP Sand Management System
  </div>

</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBAx9O9XU2QChADnpZMFEFqgMYJmWsxxko8",
  authDomain: "ap-sand-billing.firebaseapp.com",
  projectId: "ap-sand-billing",
  storageBucket: "ap-sand-billing.firebasestorage.app",
  messagingSenderId: "908803132126",
  appId: "1:908803132126:web:04e7bdafaa6baf80bb104f",
  measurementId: "G-RXHD8RW3WX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const fieldKeys = {
  regId: ["regId", "RegistrationID", "registrationId"],
  consumerName: ["consumerName", "ConsumerName"],
  consumerMobile: ["consumerMobile", "ConsumerMobile"],
  constructionName: ["constructionName", "ConstructionName"],
  regDateTime: ["regDateTime", "RegistrationDateTime"],
  regType: ["regType", "RegistrationType"],
  regQty: ["regQty", "RegistrationQTY"],
  regAddress: ["regAddress", "RegistrationAddress"]
};

function showStatus(message) {
  document.getElementById("status").textContent = message;
  document.getElementById("status").style.display = "block";
  document.getElementById("details").style.display = "none";
}

function showDetails(data) {
  for (const id of Object.keys(fieldKeys)) {
    let value = "";

    for (const key of fieldKeys[id]) {
      if (
        data[key] !== undefined &&
        data[key] !== null &&
        String(data[key]).trim() !== ""
      ) {
        value = String(data[key]);
        break;
      }
    }

    document.getElementById(id).textContent = value || "-";
  }

  document.getElementById("status").style.display = "none";
  document.getElementById("details").style.display = "block";
}

function decodeRegistrationHash() {
  const hash = window.location.hash;

  if (!hash.startsWith("#registration=")) {
    return null;
  }

  try {
    let encoded = hash.substring("#registration=".length);
    encoded = decodeURIComponent(encoded);

    const binary = atob(encoded);
    const bytes = Uint8Array.from(
      binary,
      character => character.charCodeAt(0)
    );

    const json = new TextDecoder().decode(bytes);
    return JSON.parse(json);
  } catch (error) {
    console.error("QR data decode error:", error);
    return null;
  }
}

function getURLDetails() {
  const params = new URLSearchParams(window.location.search);
  const data = {};

  for (const id of Object.keys(fieldKeys)) {
    for (const key of fieldKeys[id]) {
      const value = params.get(key);

      if (value !== null && value.trim() !== "") {
        data[id] = value.trim();
        break;
      }
    }
  }

  return data;
}

async function findFirebaseDetails(regId) {
  const snapshot = await getDocs(collection(db, "registrations"));
  let found = null;

  snapshot.forEach(doc => {
    const record = doc.data();

    const recordId =
      record.RegistrationID ??
      record.registrationId ??
      record.regId ??
      "";

    if (
      String(recordId).trim().toLowerCase() ===
      regId.trim().toLowerCase()
    ) {
      found = record;
    }
  });

  return found;
}

async function loadDetails() {
  // మొదట QRలో నేరుగా ఉన్న వివరాలు చదవాలి.
  const hashData = decodeRegistrationHash();

  if (hashData && typeof hashData === "object") {
    showDetails(hashData);
    return;
  }

  // తరువాత URL parameters ద్వారా వచ్చిన వివరాలు.
  const urlData = getURLDetails();

  if (Object.keys(urlData).length > 0) {
    showDetails(urlData);
    return;
  }

  // Registration ID మాత్రమే ఉన్నప్పుడు Firebaseలో వెతకాలి.
  const params = new URLSearchParams(window.location.search);

  const regId =
    params.get("regId") ||
    params.get("RegistrationID") ||
    params.get("registrationId");

  if (!regId) {
    showStatus(
      "Registration details లేవు. దయచేసి సరైన QR లింక్‌ను తెరవండి."
    );
    return;
  }

  showStatus("Firebase నుంచి Registration Details తెస్తున్నాం...");

  try {
    const record = await findFirebaseDetails(regId);

    if (record) {
      showDetails(record);
    } else {
      showStatus(
        "ఈ Registration ID వివరాలు Firebaseలో కనిపించలేదు: " + regId
      );
    }
  } catch (error) {
    console.error("Firebase error:", error);
    showStatus(
      "వివరాలు తెరవలేకపోయాం. ఇంటర్నెట్, Firebase Rules తనిఖీ చేయండి."
    );
  }
}

loadDetails();
</script>

</body>
</html>
